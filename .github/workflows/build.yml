name: Build Web 3D Game APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Web Game & Convert to Android
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          echo '{"appId":"com.vansh.gta3d","appName":"GTA 3D Game","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-3D-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
